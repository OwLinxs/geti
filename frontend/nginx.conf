server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Corpo maior para upload de anexos/mídia das mensagens.
    client_max_body_size 25m;

    # SPA: encaminha rotas desconhecidas para o index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Encaminha chamadas de API para o backend (ajuste o host conforme o deploy).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Integração ZapGov (gateway de WhatsApp) ---
    # Estes endpoints ficam na RAIZ (fora de /api) para casar com o contrato do
    # gateway. O ZapGov chama estes caminhos; a mídia assinada é servida por eles.
    #   POST /integracao/zapgov/eventos  (webhook)
    #   GET  /v1/chamados                (listagem por telefone)
    #   GET  /midia/:osId/:msgId         (anexo assinado para o ZapGov)
    location /integracao/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /midia/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
